name: release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # macOS + Windows desktop targets, always on the latest runners.
  # macOS uses macos-latest (Apple Silicon); the Intel/x86_64 binary
  # is cross-compiled from that same runner.
  # Windows uses windows-latest for x86_64. The arm64 MSVC target is not
  # built: it has never been verified on a real arm64 Windows machine.
  #
  # Every leg builds the pluggable transports first and ships them in a
  # pt/ folder beside the binary, so tor works out of the box with
  # nothing for anyone to install by hand.
  # ------------------------------------------------------------------
  desktop:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            archive: aether-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            archive: aether-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            archive: aether-windows-x86_64.zip
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build pluggable transports
        shell: bash
        run: bash ../pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt"

      - name: Build psiphon
        shell: bash
        run: bash ../psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt"

      - name: Build release binary
        run: cargo build --release --features tor --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  aether pt

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force pt target/${{ matrix.target }}/release/pt
          Compress-Archive -Path target/${{ matrix.target }}/release/aether.exe,target/${{ matrix.target }}/release/pt,run-aether.bat -DestinationPath ${{ matrix.archive }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux targets, built inside the latest Fedora container.
  # x86_64 builds on an x86_64 runner and arm64 on a native arm64
  # runner, both using fedora:latest so binaries link against a fresh
  # Fedora toolchain. Rust is installed via rustup to guarantee the
  # latest stable (>= 1.98 required by the crate).
  # ------------------------------------------------------------------
  linux:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            archive: aether-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            archive: aether-linux-arm64.tar.gz
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Install system dependencies (Fedora)
        working-directory: /
        run: |
          dnf -y install \
            gcc gcc-c++ make cmake ninja-build golang nasm clang \
            perl perl-FindBin perl-IPC-Cmd \
            curl git tar gzip xz unzip findutils which

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust (latest stable via rustup)
        working-directory: /
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build pluggable transports
        run: bash ../pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt"

      - name: Build psiphon
        run: bash ../psiphon-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt"

      - name: Build release binary
        run: cargo build --release --features tor --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  aether pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  

  # ------------------------------------------------------------------
  # Collect every artifact, generate SHA-256 checksums and publish.
  # Runs even if some build legs failed, so one broken target never
  # blocks shipping the ones that succeeded.
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: [desktop, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
          body: |
            New Aether

            Aether is a user-space proxy client. It tunnels traffic out of a filtered network and exposes a local SOCKS5 proxy on 127.0.0.1:1819. Point a browser, terminal, or system proxy at that address and your traffic leaves through the tunnel.
